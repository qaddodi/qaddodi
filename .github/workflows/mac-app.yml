name: Build Mac app

on:
  push:
    paths:
      - "mac-app/**"
      - ".github/workflows/mac-app.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Use a placeholder page if the game file isn't committed yet
        run: |
          if [ ! -f mac-app/Zayn-Letter-Adventure.html ]; then
            echo '<!doctype html><title>placeholder</title><h1>Build test</h1>' > mac-app/Zayn-Letter-Adventure.html
          fi

      - name: Build the app (Apple chip + Intel)
        env:
          CI: "1"
        run: |
          bash mac-app/build.sh
          lipo -info "mac-app/Zayn Letter Adventure.app/Contents/MacOS/ZaynLetterAdventure"
          ls -la "mac-app/Zayn Letter Adventure.app/Contents/Resources"

      - name: Zip it
        run: |
          cd mac-app
          ditto -c -k --sequesterRsrc --keepParent "Zayn Letter Adventure.app" ../Zayn-Letter-Adventure-Mac.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Zayn-Letter-Adventure-Mac
          path: Zayn-Letter-Adventure-Mac.zip
          retention-days: 90
